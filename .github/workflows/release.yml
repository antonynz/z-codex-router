name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Release gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS POSIX sh
            os: macos-latest
            shell: sh
            command: sh scripts/test_all.sh
          - name: Linux POSIX sh
            os: ubuntu-latest
            shell: sh
            command: sh scripts/test_all.sh
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
            command: .\scripts\test_all.ps1
          - name: PowerShell 7
            os: windows-latest
            shell: pwsh
            command: ./scripts/test_all.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run script-only release gate
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}

  package:
    name: Build universal source archives
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and source version
        shell: sh
        run: |
          expected=${GITHUB_REF_NAME#v}
          release=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/z-codex-router/release/manifest.json | sed -n '1p')
          plugin=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/z-codex-router/.codex-plugin/plugin.json | sed -n '1p')
          test "$expected" = "1.0.0"
          test "$release" = "$expected"
          test "$plugin" = "$expected"
      - name: Verify rewritten history and package sources
        shell: sh
        run: |
          sh scripts/verify_source.sh --history
          sh scripts/package_release.sh --out dist
          sh scripts/test_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z-codex-router-1.0.0-source
          path: |
            dist/z-codex-router-1.0.0.tar.gz
            dist/z-codex-router-1.0.0.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Replace GitHub v1.0.0 Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: z-codex-router-1.0.0-source
          path: dist
      - name: Delete old Release and create script-only Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "Z Codex Router $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/z-codex-router-1.0.0.tar.gz \
            dist/z-codex-router-1.0.0.zip \
            dist/SHA256SUMS
