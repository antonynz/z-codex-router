name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-posix:
    name: Release gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS POSIX sh
            os: macos-latest
          - name: Linux POSIX sh
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run script-only release gate
        shell: sh
        run: sh scripts/test_all.sh

  test-windows-powershell:
    name: Release gate (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run script-only release gate
        shell: powershell
        run: .\scripts\test_all.ps1

  test-powershell-core:
    name: Release gate (PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run script-only release gate
        shell: pwsh
        run: ./scripts/test_all.ps1

  package:
    name: Build universal source archives
    needs: [test-posix, test-windows-powershell, test-powershell-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag and source version
        shell: sh
        run: |
          expected=${GITHUB_REF_NAME#v}
          release=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/z-codex-router/release/manifest.json | sed -n '1p')
          plugin=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/z-codex-router/.codex-plugin/plugin.json | sed -n '1p')
          printf '%s\n' "$expected" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$release" = "$expected"
          test "$plugin" = "$expected"
      - name: Verify rewritten history and package sources
        shell: sh
        run: |
          sh scripts/verify_source.sh --history
          sh scripts/package_release.sh --out dist
          sh scripts/test_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: z-codex-router-${{ github.ref_name }}-source
          path: |
            dist/z-codex-router-*.tar.gz
            dist/z-codex-router-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub tag release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: z-codex-router-${{ github.ref_name }}-source
          path: dist
      - name: Create script-only Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf '%s\n' "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          expected=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "Z Codex Router $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            "dist/z-codex-router-${expected}.tar.gz" \
            "dist/z-codex-router-${expected}.zip" \
            dist/SHA256SUMS
