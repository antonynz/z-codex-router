name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run POSIX lifecycle, policy, source and release tests
        shell: sh
        run: sh scripts/test_all.sh
      - name: Scan all reachable Git blobs for compiled executables
        shell: sh
        run: sh scripts/verify_source.sh --history

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Windows PowerShell 5.1 lifecycle and release tests
        shell: powershell
        run: .\scripts\test_all.ps1
      - name: Check rewritten history paths
        shell: powershell
        run: .\scripts\verify_source.ps1 -History

  powershell-core:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run PowerShell 7 lifecycle and release tests
        shell: pwsh
        run: ./scripts/test_all.ps1
