name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: sh -n install.sh
      - run: python3 scripts/test_bootstrap.py
      - run: python3 scripts/verify_source.py
      - name: Reject legacy source modules
        shell: bash
        run: |
          test -z "$(find . -type f \( -name '*.[g]o' -o -name 'g''o.mod' -o -name 'g''o.sum' \) -not -path './.git/*' -print)"
