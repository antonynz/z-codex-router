schema_version = 1

[metadata]
name = "portable-default"
status = "stable"
purpose = "只选择明确兼容的 stable profile；否则 fail closed。"

[preflight]
## Runtime metadata 使用三态：缺失字段明确视为 unobservable，而不是 mismatch。
## 字段可见时仍必须精确匹配。
require_explicit_runtime_metadata = false
require_exact_route_match = true
require_platform_capability = true
runtime_observability = "three-state"
on_unknown = "receipt-aware"
on_missing_profile = "fail-closed"
on_incompatible_profile = "fail-closed"
on_disabled_candidate = "fail-closed"

[receipt]
protocol = 1
classification_owner = "parent"
creation_tool = "create_thread"
max_automatic_root_creations = 1
thread_id_source = "create_thread-return-only"
child_reclassification = "forbidden"
stage_reclassification = "parent-only-same-thread"
invalid_or_forged = "reject"

[observability]
states = ["verified", "mismatch", "unobservable"]
observable_exact = "verified"
observable_mismatch = "mismatch-fail-closed"
unobservable_non_c3 = "requested-accepted-unverified"
unobservable_c3 = "block-until-explicit-one-time-route-exception"

[creation]
authorization = "managed-enable-persistent-until-uninstall"
authorization_scope = "route-root-create-thread-only"
dispatch = "A0-current-root;A1-C3-create-once"
execution_root = "valid-parent-receipt-execute-no-recursion"
model_effort_parameter = "model+thinking"
ready = "threadId:ROUTE_READY"
pending = "clientThreadId:ROUTE_PENDING-no-retry"
policy_denied = "ROUTE_HANDOFF_REQUIRED"
destination_tuple_denied = "ROUTE_DESTINATION_TUPLE_UNAVAILABLE"
input_rejected = "ROUTE_INPUT_REJECTED"
outcome_unknown = "ROUTE_OUTCOME_UNKNOWN-no-retry"
silent_fallback = false
spawn_agent_fallback = false

[selection]
stable_profile = "stable/current-gpt-5.6-reference.toml"
candidate_profiles = ["candidate/example-next-model.toml"]
allow_candidate_as_default = false
silent_fallback = false

[profile_override]
## 本文件有意位于不可变版本 payload 之外。
## override 格式错误时，绝不静默 fallback 到此随附 mapping。
user_path = "z-codex-router-profile.toml"
precedence = ["explicit-user-session-cli", "validated-user-override", "shipped-default"]
invalid = "fail-closed"
runtime_allowlist = "create-thread-intersection-fail-closed"
restore = "managed-backup-only-validate-atomic"
